      <path d="M10 22 V14 M18 22 V14" stroke="#2A9B8A" stroke-width="1.6" stroke-linecap="round"/>
      <text x="36" y="19" fill="rgba(176,187,204,0.92)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">&#x0426;&#x0418;&#x0424;&#x0420;&#x041E;&#x0412;&#x041E;&#x0419; &#x041F;&#x041E;&#x041C;&#x041E;&#x0429;&#x041D;&#x0418;&#x041A;</text>
    </g>
