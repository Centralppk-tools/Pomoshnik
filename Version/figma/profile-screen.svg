    <text x="327" y="29" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" text-anchor="middle">&#x041F;&#x043E;&#x0434;&#x0434;&#x0435;&#x0440;&#x0436;&#x0430;&#x0442;&#x044C;</text>
