        <stop offset="0%" stop-color="#024C4E"/>
        <stop offset="50%" stop-color="#038B6F"/>
        <stop offset="100%" stop-color="#06CA86"/>
      </linearGradient>
    </defs>
    <path d="M0 50 h388 v18 a16 16 0 0 1 -16 16 H16 a16 16 0 0 1 -16 -16 Z" fill="url(#titleGrad)"/>
    <text x="194" y="72" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">&#x041B;&#x0438;&#x0447;&#x043D;&#x044B;&#x0439; &#x043A;&#x0430;&#x0431;&#x0438;&#x043D;&#x0435;&#x0442;</text>
