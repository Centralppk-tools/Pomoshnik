    <text x="86" y="90" fill="#8B97AB" font-family="Arial, Helvetica, sans-serif" font-size="12">&#x041D;&#x0430;&#x0436;&#x043C;&#x0438;&#x0442;&#x0435;, &#x0447;&#x0442;&#x043E;&#x0431;&#x044B; &#x0432;&#x044B;&#x0431;&#x0440;&#x0430;&#x0442;&#x044C; &#x0444;&#x043E;&#x0442;&#x043E;</text>
